[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "my-little-gatherer"
version = "0.1.0"
dependencies = [
    "openai",
    "streamlit",
    "python-dotenv",
    "pydantic-settings",
    "fastapi>=0.141.1",
]

[tool.setuptools.packages.find]
where = ["src"]
